<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Войти — Citronus Bots</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />

  <!-- Авто-редирект: если токен есть и НЕ просрочен — сразу на главную -->
  <script src="login-guard.js"></script>
</head>
<body>

  <div class="auth-wrapper">

    <!--
         ЛЕВАЯ ПОЛОВИНА — брендинг
 -->
    <div class="panel panel-left">
      <div class="brand">

        <div class="brand-top">
          <svg class="brand-bolt" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
          </svg>
          <span class="brand-citro">CITRO</span>
        </div>

        <span class="brand-sub">Trading Bots</span>

        <div class="brand-divider"></div>

        <p class="brand-tagline">
          Автоматизируй торговлю<br>на бирже Citronus
        </p>

      </div>
    </div>


    <!--
         ПРАВАЯ ПОЛОВИНА — форма
 -->
    <div class="panel panel-right">
      <div class="form-container">

        <!-- ФОРМА ВХОДА -->
        <div class="auth-form" id="loginForm">
          <h2 class="form-title">Войти</h2>

          <div class="field-group" data-field="login">
            <label class="field-label">Логин</label>
            <input class="field-input" type="text"
                   placeholder="Введите ваш логин"
                   autocomplete="username" />
            <span class="field-error"></span>
          </div>

          <div class="field-group" data-field="password">
            <label class="field-label">Пароль</label>
            <div class="input-wrapper">
              <input class="field-input" type="password"
                     placeholder="Введите ваш пароль"
                     autocomplete="current-password" />
              <button class="toggle-pw" type="button" aria-label="Показать пароль">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span class="field-error"></span>
          </div>

          <div class="remember-group">
            <input class="remember-checkbox" type="checkbox" id="rememberMe" />
            <label class="remember-label" for="rememberMe">Запомнить меня</label>
          </div>

          <button class="btn-primary">Войти</button>
          <button class="btn-secondary">Зарегистрироваться</button>
        </div>


        <!-- ФОРМА РЕГИСТРАЦИИ (скрыта) -->
        <div class="auth-form hidden" id="registerForm">
          <h2 class="form-title">Регистрация</h2>

          <div class="field-group" data-field="login">
            <label class="field-label">Логин</label>
            <input class="field-input" type="text"
                   placeholder="Введите ваш логин"
                   autocomplete="username" />
            <span class="field-error"></span>
          </div>

          <div class="field-group" data-field="password">
            <label class="field-label">Пароль</label>
            <div class="input-wrapper">
              <input class="field-input" type="password"
                     placeholder="Введите ваш пароль"
                     autocomplete="new-password" />
              <button class="toggle-pw" type="button" aria-label="Показать пароль">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span class="field-error"></span>
          </div>

          <div class="field-group" data-field="confirm">
            <label class="field-label">Повторите пароль</label>
            <div class="input-wrapper">
              <input class="field-input" type="password"
                     placeholder="Повторите ваш пароль"
                     autocomplete="new-password" />
              <button class="toggle-pw" type="button" aria-label="Показать пароль">
                <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span class="field-error"></span>
          </div>

          <button class="btn-primary">Зарегистрироваться</button>
          <button class="btn-secondary">Уже есть аккаунт? Войти</button>
        </div>

      </div>
    </div>

  </div>

  <script src="errors.js"></script>
  <script src="common.js"></script>
  <script src="auth.js"></script>
</body>
</html>
