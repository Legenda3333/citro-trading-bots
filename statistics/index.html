<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Статистика — Citro Trading Bots</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />

  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="./statistics.css" />

  <!-- Защита: без токена или с просроченным токеном — на страницу входа -->
  <script src="../auth-guard.js"></script>
</head>
<body>

  <!--
       НАВБАР — общий для всех внутренних страниц
 -->
  <nav class="navbar">

    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
      </svg>
      <span class="logo-text">Citro <span class="logo-accent">Trading Bots</span></span>
    </div>

    <div class="nav-links">
      <a href="/main/"     class="nav-link">Главная</a>
      <a href="/bots/"     class="nav-link">Мои боты</a>
      <a href="/api-keys/" class="nav-link">API-ключи</a>
    </div>

    <div class="nav-actions">

      <!-- Текущая страница — иконка подсвечена (active) -->
      <a href="/statistics/" class="icon-btn active" data-tooltip="Статистика" aria-label="Статистика">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <rect x="2"  y="14" width="4" height="6" rx="1"/>
          <rect x="10" y="4"  width="4" height="16" rx="1"/>
          <rect x="18" y="10" width="4" height="10" rx="1"/>
        </svg>
      </a>

      <!-- Профиль с выпадающим меню по наведению -->
      <div class="profile-wrapper">

        <button class="icon-btn" aria-label="Профиль">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </button>

        <div class="profile-dropdown">
          <div class="profile-bridge"></div>
          <div class="profile-card">
            <p class="profile-username" id="dropdownUsername">—</p>
            <p class="profile-id"       id="dropdownId">ID: —</p>
            <div class="profile-sep"></div>
            <button class="logout-btn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Выйти
            </button>
          </div>
        </div>

      </div>

    </div>
  </nav>


  <!--
       ОСНОВНОЙ КОНТЕНТ
 -->
  <main class="page-main stats-main">

    <div class="page-header">
      <div class="page-title-row">
        <h1 class="page-title">Статистика</h1>
      </div>
    </div>

    <!-- Карточки-итоги -->
    <section class="stat-summary" id="stat-summary">
      <div class="stat-card stat-card--pnl">
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
            <polyline points="17 6 23 6 23 12"/>
          </svg>
        </span>
        <div class="stat-card-body">
          <span class="stat-card-label">Общий PnL</span>
          <span class="stat-card-value" id="sum-pnl">—</span>
        </div>
      </div>

      <div class="stat-card stat-card--fees">
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="5" x2="5" y2="19"/>
            <circle cx="6.5" cy="6.5" r="2.5"/>
            <circle cx="17.5" cy="17.5" r="2.5"/>
          </svg>
        </span>
        <div class="stat-card-body">
          <span class="stat-card-label">Комиссии</span>
          <span class="stat-card-value" id="sum-fees">—</span>
        </div>
      </div>

      <div class="stat-card stat-card--net">
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4z"/>
          </svg>
        </span>
        <div class="stat-card-body">
          <span class="stat-card-label">Чистая прибыль</span>
          <span class="stat-card-value" id="sum-net">—</span>
        </div>
      </div>

      <div class="stat-card stat-card--volume">
        <span class="stat-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </span>
        <div class="stat-card-body">
          <span class="stat-card-label">Объём</span>
          <span class="stat-card-value" id="sum-vol">—</span>
        </div>
      </div>
    </section>

    <!-- Фильтры (кастомные выпадающие списки — нужны иконки в опциях) -->
    <section class="stat-filters" id="stat-filters">
      <div class="stat-filter">
        <span class="stat-filter-label">Бот</span>
        <div class="stat-dd" data-filter="bot" data-value="">
          <button type="button" class="stat-dd-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="stat-dd-value">Все боты</span>
            <svg class="stat-dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <ul class="stat-dd-menu" role="listbox"></ul>
        </div>
      </div>

      <div class="stat-filter">
        <span class="stat-filter-label">Тип</span>
        <div class="stat-dd" data-filter="type" data-value="">
          <button type="button" class="stat-dd-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="stat-dd-value">Все типы</span>
            <svg class="stat-dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <ul class="stat-dd-menu" role="listbox"></ul>
        </div>
      </div>

      <div class="stat-filter">
        <span class="stat-filter-label">Торговая пара</span>
        <div class="stat-dd" data-filter="pair" data-value="">
          <button type="button" class="stat-dd-btn" aria-haspopup="listbox" aria-expanded="false">
            <span class="stat-dd-value">Все пары</span>
            <svg class="stat-dd-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <ul class="stat-dd-menu" role="listbox"></ul>
        </div>
      </div>

      <button class="stat-reset" id="filter-reset" type="button">
        <svg class="stat-reset-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        <span>Сбросить фильтры</span>
      </button>
    </section>

    <!-- Вкладки -->
    <div class="stat-tabs" role="tablist">
      <button class="stat-tab is-active" data-tab="bots" type="button" role="tab">
        Боты <span class="stat-tab-count" id="tab-count-bots"></span>
      </button>
      <button class="stat-tab" data-tab="trades" type="button" role="tab">
        Сделки <span class="stat-tab-count" id="tab-count-trades"></span>
      </button>
    </div>

    <!-- Панель с таблицей -->
    <section class="stat-panel">

      <!-- Загрузка (пока нет данных) -->
      <div class="stat-state" id="stat-loading">
        <div class="bot-spinner"></div>
        <p>Загрузка статистики…</p>
      </div>

      <!-- Ошибка загрузки -->
      <div class="stat-state" id="stat-error" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p>Не удалось загрузить статистику.</p>
        <button class="stat-retry" id="stat-retry" type="button">Повторить</button>
      </div>

      <!-- Пусто (после загрузки, но нет данных по фильтру) -->
      <div class="stat-state" id="stat-empty" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2"  y="14" width="4" height="6" rx="1"/>
          <rect x="10" y="4"  width="4" height="16" rx="1"/>
          <rect x="18" y="10" width="4" height="10" rx="1"/>
        </svg>
        <p id="stat-empty-text">Пока нет данных для отображения.</p>
      </div>

      <!-- Таблица (thead/tbody рисует JS под активную вкладку) -->
      <div class="stat-table-wrap" id="stat-table-wrap" hidden>
        <table class="stat-table">
          <thead id="stat-thead"></thead>
          <tbody id="stat-tbody"></tbody>
        </table>
      </div>

      <!-- Пагинация -->
      <div class="stat-pager" id="stat-pager" hidden></div>

    </section>

  </main>

  <script src="../common.js"></script>
  <script src="./statistics.js"></script>

</body>
</html>
